name: tester

# Kjoerer paa hver push og hver pull request mot main. Emnets vurdering ber om
# dokumentasjon paa hvordan koden er kvalitetssikret, og en groenn kjoering paa
# hver commit er det billigste beviset vi kan gi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ingen hemmeligheter er tilgjengelige for jobben, og ingen skal vaere det.
# Alle testene gaar uten nett - conftest.py sperrer utgaaende tilkoblinger -
# saa denne workflowen kan ikke bruke av EODHD-kvoten paa 20 kall i doegnet.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Suiten bruker 1-2 minutter. Uten grense kan en test som henger, holde
    # paa i opptil 6 timer. Hele suiten hang 07.10 og en gang 08.10 (story 2.3).
    timeout-minutes: 15

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sett opp uv og Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Installer avhengigheter fra uv.lock
        # --locked feiler hvis uv.lock ikke stemmer med pyproject.toml.
        # Da skal kjoeringen stoppe, ikke stille loese det opp.
        run: uv sync --locked

      # Story 9.7: ruff foer testene, med reglene i pyproject.toml. Samme
      # kommandoer som tests/test_ruff.py og som README-en ber om foer en commit.
      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: Kjoer testene
        # Samme kommando som lokalt, jf. README.
        # Story 9.7 (BH14, ECH1): ogsaa naar ruff har feilet, saa en glemt
        # formattering ikke skjuler resultatet av testene.
        if: success() || failure()
        run: uv run pytest -q

  # Story 3.1: imaget bygges og proeves, uten hemmeligheter og uten EODHD.
  # Det eneste nettet jobben bruker, er nedlastingen av grunnbildet og uv.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Bygg imaget fra ren utsjekk
        run: docker build -t ose-signal:ci .

      - name: Ingen rådata, base eller nøkkel i imaget (AD-9, AD-12)
        # Som root, saa ingen mappe er lukket for find. Samme moenstre som
        # .dockerignore.
        run: |
          funn=$(docker run --rm --user root --network none ose-signal:ci sh -c \
            'find / -xdev \( -name "*.db" -o -name "*.db-*" -o -name "*-raa-*.json" -o -name "*-raw-*.json" -o -name "raadata-*.json" -o -name "newsweb-*.json" -o -name ".env" -o -name ".env.*" -o -name "__pycache__" -path "/app/*" \) -print 2>/dev/null; find /app/data -type f')
          if [ -n "$funn" ]; then echo "$funn"; exit 1; fi
          if docker image inspect ose-signal:ci --format '{{json .Config.Env}}' | grep -q EODHD; then
            echo "EODHD i miljøet til imaget"; exit 1
          fi

      - name: Python 3.13 og Oslo-tid fra tzdata i uv.lock (AD-20)
        # PYTHONTZPATH tom: zoneinfo ser bort fra /usr/share/zoneinfo i
        # grunnbildet og maa bruke pakken tzdata fra uv.lock.
        run: |
          docker run --rm --network none -e PYTHONTZPATH= ose-signal:ci python -c "
          import sys, zoneinfo, datetime as d
          assert sys.version_info[:2] == (3, 13), sys.version
          assert zoneinfo.TZPATH == (), zoneinfo.TZPATH
          oslo = zoneinfo.ZoneInfo('Europe/Oslo')
          vinter = d.datetime(2026, 1, 15, 12, tzinfo=d.timezone.utc).astimezone(oslo)
          sommer = d.datetime(2026, 7, 15, 12, tzinfo=d.timezone.utc).astimezone(oslo)
          assert vinter.utcoffset() == d.timedelta(hours=1) and sommer.utcoffset() == d.timedelta(hours=2)
          print(sys.version.split()[0], vinter.isoformat(), sommer.isoformat())
          "

      - name: Webserveren svarer uten nett og uten nøkkel (AD-10)
        # Den tomme siden med hentekommandoen for Docker (OSE_I_DOCKER, story
        # 3.3), og basen er migrert av aapne_base ved foerste forespoersel.
        run: |
          c=$(docker run -d --network none ose-signal:ci)
          ok=0
          for i in $(seq 1 30); do
            if docker exec "$c" python -c "
          import urllib.request, sys
          s = urllib.request.urlopen('http://127.0.0.1:8000/')
          html = s.read().decode()
          sys.exit(0 if s.status == 200 and 'docker compose run --rm hent' in html else 1)
          " 2>/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          docker logs "$c" || true
          base=$(docker exec "$c" sh -c 'test -s /app/data/db/ose.db && echo ja' || echo nei)
          noekler=$(docker exec "$c" sh -c 'env | grep -c EODHD || true' || echo feil)
          docker rm -f "$c" > /dev/null
          echo "svar $ok, base $base, EODHD-variabler $noekler"
          [ "$ok" = 1 ] && [ "$base" = ja ] && [ "$noekler" = 0 ]

      - name: Hentingen uten nøkkel og uten nett stopper før første kall
        # --uten-tidskontroll slipper forbi tidskontrollen uansett klokke, saa
        # kjoeringen gaar gjennom basen og filvakten til noekkelen.
        run: |
          set +e
          ut=$(docker run --rm --network none ose-signal:ci python src/fetch_prices.py --uten-tidskontroll 2>&1)
          kode=$?
          set -e
          echo "$ut"
          echo "kode $kode"
          if echo "$ut" | grep -q Traceback; then exit 1; fi
          echo "$ut" | grep -q "EODHD_API_KEY mangler"
          [ "$kode" = 1 ]

      - name: Brukeren ose kan skrive i nye navngitte volumer
        run: |
          docker volume create ose-ci-db > /dev/null
          docker volume create ose-ci-raa > /dev/null
          set +e
          docker run --rm --network none -v ose-ci-db:/app/data/db -v ose-ci-raa:/app/data/raa ose-signal:ci \
            sh -c 'touch /app/data/db/x /app/data/raa/x && stat -c "%U %n" /app/data/db /app/data/raa'
          kode=$?
          set -e
          docker volume rm ose-ci-db ose-ci-raa > /dev/null
          [ "$kode" = 0 ]

      - name: Volumene i drift med compose (story 3.2, AD-11)
        # Eget prosjekt, saa bare volumene ose-ci-32_* lages og fjernes. app
        # kjoeres med innstillingene i compose.yaml, ogsaa read_only og tmpfs.
        run: |
          p=ose-ci-32
          # Foer trap: finnes volumene fra foer, stopper steget uten aa roere dem.
          fra_foer=$(docker volume ls -q --filter "name=^${p}_")
          if [ -n "$fra_foer" ]; then echo "volumer fra før: $fra_foer"; exit 1; fi
          trap 'docker compose -p $p down -v > /dev/null 2>&1 || true; docker volume rm ${p}_ose-db ${p}_ose-raa > /dev/null 2>&1 || true' EXIT
          svar() {
            for i in $(seq 1 30); do
              if docker compose -p $p exec -T app python -c "
          import urllib.request, sys
          s = urllib.request.urlopen('http://127.0.0.1:8000/')
          sys.exit(0 if s.status == 200 and 'docker compose run --rm hent' in s.read().decode() else 1)
          " 2>/dev/null; then return 0; fi
              sleep 1
            done
            docker compose -p $p logs app
            return 1
          }
          # Ny og tom base: siste skjemaversjon og ingen rader i kurs eller vurdering.
          tom_base() {
            docker compose -p $p exec -T app python -c "
          import sqlite3, lagring_sqlite as l
          from migrering import siste_versjon, versjon
          c = sqlite3.connect('file:/app/data/db/ose.db?mode=ro', uri=True)
          assert versjon(c) == siste_versjon(l.MIGRASJONSKATALOG), versjon(c)
          for tabell in ('kurs', 'vurdering'):
              assert c.execute(f'select count(*) from {tabell}').fetchone()[0] == 0, tabell
          "
          }
          docker compose -p $p up -d --build app
          svar
          tom_base
          # Bare /tmp og volumet kan skrives: tempfile bruker /tmp, og en fil i
          # hjemmemappa til ose, som ose eier, gir «Read-only file system».
          docker compose -p $p exec -T app python -c "
          import tempfile
          assert tempfile.gettempdir() == '/tmp', tempfile.gettempdir()
          tempfile.TemporaryFile('w+b').close()
          "
          ut=$(docker compose -p $p exec -T app sh -c 'touch /home/ose/skrevet' 2>&1 || true)
          echo "$ut" | grep -q "Read-only file system"
          # app har bare ose-db.
          monteringer=$(docker inspect "$(docker compose -p $p ps -q app)" --format '{{range .Mounts}}{{.Destination}} {{end}}')
          echo "app har $monteringer"
          [ "$(echo $monteringer)" = "/app/data/db" ]
          # En fil i ose-raa og et merke i ose-db.
          docker volume create ${p}_ose-raa > /dev/null
          docker run --rm --network none -v ${p}_ose-raa:/app/data/raa ose-signal:ci sh -c 'echo {} > /app/data/raa/kurser-raa-2026-01-02.json'
          docker compose -p $p exec -T app touch /app/data/db/merke
          # Basevolumet fjernes, oeyeblikksbildene staar.
          docker compose -p $p rm -s -f app
          docker volume rm ${p}_ose-db > /dev/null
          docker compose -p $p up -d app
          svar
          set +e
          docker compose -p $p exec -T app test -e /app/data/db/merke
          merke=$?
          set -e
          [ "$merke" = 1 ]
          tom_base
          docker run --rm --network none -v ${p}_ose-raa:/app/data/raa ose-signal:ci test -f /app/data/raa/kurser-raa-2026-01-02.json
          echo "ose-db fjernet og laget paa nytt, tom, og ose-raa sto"

      - name: Demoen med compose, uten .env og uten nøkkel (story 3.4)
        # Eget prosjekt, saa bare volumet ose-ci-34_ose-demo lages og fjernes.
        # Kommandoene fra README-en med -f foran, mot en kopi av compose.yaml
        # med name: ose-ci-34. Ikke -p: med -p stopper docker compose down
        # ogsaa demoen, uten -p gjoer den det ikke (Compose v5.5.1, proevd
        # 10.10), og README-en bruker ikke -p.
        run: |
          p=ose-ci-34
          f=compose-ci-34.yaml
          test ! -e .env
          test ! -e $f
          sed "s/^name: ose-signal$/name: $p/" compose.yaml > $f
          grep -q "^name: $p$" $f
          # Foer trap: finnes volumet fra foer, stopper steget uten aa roere det.
          fra_foer=$(docker volume ls -q --filter "name=^${p}_")
          if [ -n "$fra_foer" ]; then echo "volumer fra før: $fra_foer"; exit 1; fi
          trap 'docker compose -f $f --profile demo down > /dev/null 2>&1 || true; docker volume rm ${p}_ose-demo > /dev/null 2>&1 || true; rm -f $f' EXIT
          # Feiler demo-lag, vises utskriften foer trap rydder (ECH10).
          if ! docker compose -f $f up -d --build demo; then
            docker compose -f $f --profile demo logs demo-lag; exit 1
          fi
          # Oversikten og en aksje svarer 200 med «Eksempeltall» (VG9).
          sider() {
            for i in $(seq 1 30); do
              if docker compose -f $f exec -T demo python -c "
          import urllib.request, sys
          for rute, tekst in (('/', 'Brattfjell Energi'), ('/aksje/BRFE', 'Brattfjell Energi')):
              s = urllib.request.urlopen('http://127.0.0.1:8000' + rute, timeout=5)
              html = s.read().decode()
              if s.status != 200 or 'Eksempeltall' not in html or tekst not in html:
                  sys.exit(rute + ' svarte ' + str(s.status))
          "; then return 0; fi
              sleep 1
            done
            docker compose -f $f --profile demo logs
            return 1
          }
          sider
          # Fra maskinen, gjennom porten paa 127.0.0.1, som README-en viser (VG4).
          curl -fsS --max-time 5 http://127.0.0.1:8000/ | grep -q Eksempeltall
          # Story 3.4b (gjennomgangen, ECH7): demo-lag skrev KI-radene fra
          # src/demo_ki_tekster.json, og aksjesiden viser teksten uten Ollama.
          docker compose -f $f --profile demo logs demo-lag | grep -q "KI-tekst for "
          curl -fsS --max-time 5 http://127.0.0.1:8000/aksje/BRFE | grep -q "Laget av KI"
          # Demobasen lages paa nytt mens demoen kjoerer, som README-en sier (VG2).
          docker compose -f $f run --rm demo-lag
          sider
          # demo og demo-lag har bare ose-demo, og demo-lag gikk ut med kode 0.
          for t in demo demo-lag; do
            c=$(docker compose -f $f ps -a -q $t)
            m=$(docker inspect "$c" --format '{{range .Mounts}}{{.Name}}:{{.Destination}} {{end}}')
            echo "$t har $m"
            [ "$(echo $m)" = "${p}_ose-demo:/app/data/db" ]
          done
          [ "$(docker inspect "$(docker compose -f $f ps -a -q demo-lag)" --format '{{.State.ExitCode}}')" = 0 ]
          # docker compose down uten profilen stopper ikke demoen, som README-en
          # sier (Compose v5.5.1, proevd 10.10). Endres det, maa README-en rettes (VG5).
          docker compose -f $f down
          [ "$(docker inspect "$(docker compose -f $f ps -q demo)" --format '{{.State.Running}}')" = true ]
          # Stoppkommandoen fra README-en etterlater ingen container, og volumet staar.
          docker compose -f $f --profile demo down
          igjen=$(docker ps -a -q --filter "label=com.docker.compose.project=$p")
          if [ -n "$igjen" ]; then docker ps -a --filter "label=com.docker.compose.project=$p"; exit 1; fi
          docker volume inspect ${p}_ose-demo > /dev/null
          echo "demoen svarte med Eksempeltall, og --profile demo down stoppet den"

      - name: Hentingen med skrivebeskyttet rot og /tmp som tmpfs
        # Samme innstillinger som hent i compose.yaml (read_only, tmpfs /tmp
        # og de to volumene), men med docker run og uten .env. Foerst det hent
        # skriver: basen migreres paa ose-db, en fil i ose-raa og en
        # midlertidig fil i /tmp. Saa hentekommandoen til noekkelen.
        run: |
          docker volume create ose-ci-ro-db > /dev/null
          docker volume create ose-ci-ro-raa > /dev/null
          trap 'docker volume rm ose-ci-ro-db ose-ci-ro-raa > /dev/null 2>&1 || true' EXIT
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v ose-ci-ro-db:/app/data/db -v ose-ci-ro-raa:/app/data/raa \
            ose-signal:ci python -c "
          import tempfile, lagring_sqlite as l, lagring_fil as f
          assert tempfile.gettempdir() == '/tmp', tempfile.gettempdir()
          tempfile.TemporaryFile('w+b').close()
          c = l.aapne_base(l.BASE_STI)
          c.execute('select count(*) from kurs').fetchone()
          c.close()
          with open(f.RAA_KATALOG / 'proeve-raa-2026-01-02.json', 'x') as ut:
              ut.write('{}')
          print('skrev basen, raa og /tmp')
          "
          set +e
          ut=$(docker run --rm --network none --read-only --tmpfs /tmp \
            -v ose-ci-ro-db:/app/data/db -v ose-ci-ro-raa:/app/data/raa \
            ose-signal:ci python src/fetch_prices.py --uten-tidskontroll 2>&1)
          kode=$?
          set -e
          echo "$ut"
          echo "kode $kode"
          if echo "$ut" | grep -q Traceback; then exit 1; fi
          echo "$ut" | grep -q "EODHD_API_KEY mangler"
          [ "$kode" = 1 ]

      - name: compose.yaml starter bare webserveren uten profilene hent og demo
        run: |
          [ "$(docker compose config --services)" = "app" ]
          [ "$(docker compose --profile hent config --services | sort | tr '\n' ' ')" = "app hent " ]
          [ "$(docker compose --profile demo config --services | sort | tr '\n' ' ')" = "app demo demo-lag " ]

  # Story 3.5a (gruppens svar 23.10 kl. 16:16): «Start demoen» med
  # dobbeltklikk proeves paa Windows og Mac, uten Docker og uten setup-uv, saa
  # spoersmaalet om uv og den offisielle installasjonen ogsaa proeves.
  # OSE_START_SVAR_JA=1 svarer ja, og OSE_START_UTEN_NETTLESER=1 aapner ingen
  # nettleser. Den ekte versjonen kjoeres bare til vernet i klonen (svaret
  # 23.10 kl. 23:31, b): den stopper med kode 1 foer uv, og trenger ingen
  # noekkel (gjennomgangen 24.10, VG4 og ECH8).
  dobbeltklikk:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OSE_START_SVAR_JA: "1"
      OSE_START_UTEN_NETTLESER: "1"

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      # Svaret 23.10 kl. 23:31 (b): klonen har .git, så den ekte versjonen
      # stopper med kode 1 før uv, .env og hentingen, og ingen nøkkel trengs.
      # Beskjeden fra vernet kreves også, fordi en PR har løsrevet HEAD, så
      # også vernet «bare fra main» ga kode 1 (gjennomgangen 24.10, VG1).
      - name: Start den ekte versjonen i klonen på Windows
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ut = & '.\Start den ekte versjonen.cmd' 2>&1 | Out-String
          $kode = $LASTEXITCODE
          Write-Host $ut
          if ($kode -ne 1) { Write-Error "Start den ekte versjonen ga kode $kode, ikke 1"; exit 1 }
          if ($ut -notmatch 'mappa har \.git' -or $ut -notmatch 'Download ZIP') { Write-Error 'Beskjeden fra vernet mangler'; exit 1 }
          if ($ut -match 'Appen trenger uv') { Write-Error 'Start den ekte versjonen kom forbi vernet'; exit 1 }
          if (Test-Path -LiteralPath '.env') { Write-Error 'Start den ekte versjonen laget .env'; exit 1 }
          Write-Host 'Start den ekte versjonen stoppet i klonen med kode 1 og uten .env'
          exit 0

      - name: Start den ekte versjonen i klonen på Mac
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: |
          kode=0
          ut="$(./"Start den ekte versjonen.command" 2>&1)" || kode=$?
          echo "$ut"
          [ "$kode" = 1 ] || { echo "Start den ekte versjonen ga kode $kode, ikke 1"; exit 1; }
          echo "$ut" | grep -q 'mappa har \.git' && echo "$ut" | grep -q 'Download ZIP' || { echo "Beskjeden fra vernet mangler"; exit 1; }
          ! echo "$ut" | grep -q 'Appen trenger uv' || { echo "Start den ekte versjonen kom forbi vernet"; exit 1; }
          [ ! -e .env ] || { echo "Start den ekte versjonen laget .env"; exit 1; }
          echo "Start den ekte versjonen stoppet i klonen med kode 1 og uten .env"

      - name: Start demoen på Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $logg = Join-Path $env:RUNNER_TEMP 'start-demoen.log'
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', '"Start demoen.cmd"' -RedirectStandardOutput $logg -RedirectStandardError "$logg.err" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 600; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match 'Eksempeltall') { $ok = $true; break }
            } catch { }
            if ($p.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          taskkill /T /F /PID $p.Id | Out-Null
          Get-Content $logg, "$logg.err" -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error 'Start demoen svarte ikke med Eksempeltall'; exit 1 }
          # Forprøven 24.10 (funn 4): æ, ø og å fra demo.py og fra skriptet, gjennom
          # Windows PowerShell 5.1 og til fila.
          $ut = [string](Get-Content -Raw -Encoding utf8 $logg) + [string](Get-Content -Raw -Encoding utf8 "$logg.err" -ErrorAction SilentlyContinue)
          foreach ($t in 'ikke data fra Oslo Børs', 'aksjer på siste dag', 'Vinduet må være åpent') {
            if (-not $ut.Contains($t)) { Write-Error "Utskriften fra Start demoen mangler «$t»"; exit 1 }
          }
          Write-Host "Start demoen svarte 200 med Eksempeltall etter $i s"

      - name: Start demoen på Mac
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -x "Start demoen.command"
          ./"Start demoen.command" > "$RUNNER_TEMP/start-demoen.log" 2>&1 &
          p=$!
          ok=0
          for i in $(seq 1 600); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/ 2>/dev/null | grep -q Eksempeltall; then ok=1; break; fi
            kill -0 "$p" 2>/dev/null || break
            sleep 1
          done
          kill "$p" 2>/dev/null || true
          pkill -f "waitress-serve --listen=127.0.0.1:8000" || true
          cat "$RUNNER_TEMP/start-demoen.log"
          [ "$ok" = 1 ] || { echo "Start demoen svarte ikke med Eksempeltall"; exit 1; }
          # Forprøven 24.10 (funn 4): æ, ø og å fra demo.py og fra skriptet.
          for t in 'ikke data fra Oslo Børs' 'aksjer på siste dag' 'Vinduet må være åpent'; do
            grep -qF "$t" "$RUNNER_TEMP/start-demoen.log" || { echo "Utskriften fra Start demoen mangler «$t»"; exit 1; }
          done
          echo "Start demoen svarte 200 med Eksempeltall etter $i s"

      # Gjennomgangen av 3.5d (VG3): porten med en fremmed lytter, en med
      # kommandolinja fra en annen mappe og en med kommandolinja fra skriptene,
      # og sjekken av kommandolinja, på Windows og Mac. uv er installert av
      # «Start demoen» over, og demoen er stoppet, så porten er ledig.
      # 3.5e: på Mac var porten fortsatt opptatt rett etter «Start demoen», og
      # alle porttestene for start.sh ble hoppet over. Steget venter til porten
      # er ledig, og feiler hvis en porttest likevel hoppes over av den grunnen.
      - name: Porten på Windows og Mac
        shell: bash
        timeout-minutes: 10
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run python -c "import socket, sys, time
          for i in range(120):
              s = socket.socket()
              if sys.platform == 'win32':
                  s.setsockopt(socket.SOL_SOCKET, socket.SO_EXCLUSIVEADDRUSE, 1)
              try:
                  s.bind(('0.0.0.0', 8000))
                  print(f'Porten 8000 er ledig etter {i} s')
                  break
              except OSError:
                  time.sleep(1)
              finally:
                  s.close()
          else:
              sys.exit('Porten 8000 ble ikke ledig etter 120 s')"
          uv run pytest -q -p no:cacheprovider -rs tests/test_dobbeltklikk.py -k "porten or sjekken" | tee "$RUNNER_TEMP/porten.log"
          if grep -q "port 8000 er i bruk" "$RUNNER_TEMP/porten.log"; then echo "En porttest ble hoppet over fordi port 8000 var i bruk"; exit 1; fi

      # Story 2.3d (gjennomgangen, VG1): kveldshenting.ps1 kjøres i en
      # midlertidig mappe med git og en falsk uv, uten Docker og uten nett.
      # Testene hoppes over på Linux, så her feiler steget hvis noen hoppes over.
      - name: Kveldshentingen på Windows
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 10
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest -q -p no:cacheprovider -rs tests/test_kveldshenting.py | tee "$RUNNER_TEMP/kveld.log"
          if grep -q "skipped" "$RUNNER_TEMP/kveld.log"; then echo "En test for kveldshentingen ble hoppet over"; exit 1; fi
