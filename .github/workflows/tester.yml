name: tester

# Kjoerer paa hver push og hver pull request mot main. Emnets vurdering ber om
# dokumentasjon paa hvordan koden er kvalitetssikret, og en groenn kjoering paa
# hver commit er det billigste beviset vi kan gi.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ingen hemmeligheter er tilgjengelige for jobben, og ingen skal vaere det.
# Alle testene gaar uten nett - conftest.py sperrer utgaaende tilkoblinger -
# saa denne workflowen kan ikke bruke av EODHD-kvoten paa 20 kall i doegnet.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Suiten bruker 1-2 minutter. Uten grense kan en test som henger, holde
    # paa i opptil 6 timer. Hele suiten hang 07.10 og en gang 08.10 (story 2.3).
    timeout-minutes: 15

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sett opp uv og Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Installer avhengigheter fra uv.lock
        # --locked feiler hvis uv.lock ikke stemmer med pyproject.toml.
        # Da skal kjoeringen stoppe, ikke stille loese det opp.
        run: uv sync --locked

      - name: Kjoer testene
        # Samme kommando som lokalt, jf. README.
        run: uv run pytest -q

  # Story 3.1: imaget bygges og proeves, uten hemmeligheter og uten EODHD.
  # Det eneste nettet jobben bruker, er nedlastingen av grunnbildet og uv.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Bygg imaget fra ren utsjekk
        run: docker build -t ose-signal:ci .

      - name: Ingen rådata, base eller nøkkel i imaget (AD-9, AD-12)
        # Som root, saa ingen mappe er lukket for find. Samme moenstre som
        # .dockerignore.
        run: |
          funn=$(docker run --rm --user root --network none ose-signal:ci sh -c \
            'find / -xdev \( -name "*.db" -o -name "*.db-*" -o -name "*-raa-*.json" -o -name "*-raw-*.json" -o -name "raadata-*.json" -o -name "newsweb-*.json" -o -name ".env" -o -name ".env.*" -o -name "__pycache__" -path "/app/*" \) -print 2>/dev/null; find /app/data -type f')
          if [ -n "$funn" ]; then echo "$funn"; exit 1; fi
          if docker image inspect ose-signal:ci --format '{{json .Config.Env}}' | grep -q EODHD; then
            echo "EODHD i miljøet til imaget"; exit 1
          fi

      - name: Python 3.13 og Oslo-tid fra tzdata i uv.lock (AD-20)
        # PYTHONTZPATH tom: zoneinfo ser bort fra /usr/share/zoneinfo i
        # grunnbildet og maa bruke pakken tzdata fra uv.lock.
        run: |
          docker run --rm --network none -e PYTHONTZPATH= ose-signal:ci python -c "
          import sys, zoneinfo, datetime as d
          assert sys.version_info[:2] == (3, 13), sys.version
          assert zoneinfo.TZPATH == (), zoneinfo.TZPATH
          oslo = zoneinfo.ZoneInfo('Europe/Oslo')
          vinter = d.datetime(2026, 1, 15, 12, tzinfo=d.timezone.utc).astimezone(oslo)
          sommer = d.datetime(2026, 7, 15, 12, tzinfo=d.timezone.utc).astimezone(oslo)
          assert vinter.utcoffset() == d.timedelta(hours=1) and sommer.utcoffset() == d.timedelta(hours=2)
          print(sys.version.split()[0], vinter.isoformat(), sommer.isoformat())
          "

      - name: Webserveren svarer uten nett og uten nøkkel (AD-10)
        # Den tomme siden med hentekommandoen for Docker (OSE_I_DOCKER, story
        # 3.3), og basen er migrert av aapne_base ved foerste forespoersel.
        run: |
          c=$(docker run -d --network none ose-signal:ci)
          ok=0
          for i in $(seq 1 30); do
            if docker exec "$c" python -c "
          import urllib.request, sys
          s = urllib.request.urlopen('http://127.0.0.1:5000/')
          html = s.read().decode()
          sys.exit(0 if s.status == 200 and 'docker compose run --rm hent' in html else 1)
          " 2>/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          docker logs "$c" || true
          base=$(docker exec "$c" sh -c 'test -s /app/data/db/ose.db && echo ja' || echo nei)
          noekler=$(docker exec "$c" sh -c 'env | grep -c EODHD || true' || echo feil)
          docker rm -f "$c" > /dev/null
          echo "svar $ok, base $base, EODHD-variabler $noekler"
          [ "$ok" = 1 ] && [ "$base" = ja ] && [ "$noekler" = 0 ]

      - name: Hentingen uten nøkkel og uten nett stopper før første kall
        # --hent-foer-kl-22 slipper forbi tidskontrollen uansett klokke, saa
        # kjoeringen gaar gjennom basen og filvakten til noekkelen.
        run: |
          set +e
          ut=$(docker run --rm --network none ose-signal:ci python src/fetch_prices.py --hent-foer-kl-22 2>&1)
          kode=$?
          set -e
          echo "$ut"
          echo "kode $kode"
          if echo "$ut" | grep -q Traceback; then exit 1; fi
          echo "$ut" | grep -q "EODHD_API_KEY mangler"
          [ "$kode" = 1 ]

      - name: Brukeren ose kan skrive i nye navngitte volumer
        run: |
          docker volume create ose-ci-db > /dev/null
          docker volume create ose-ci-raa > /dev/null
          set +e
          docker run --rm --network none -v ose-ci-db:/app/data/db -v ose-ci-raa:/app/data/raa ose-signal:ci \
            sh -c 'touch /app/data/db/x /app/data/raa/x && stat -c "%U %n" /app/data/db /app/data/raa'
          kode=$?
          set -e
          docker volume rm ose-ci-db ose-ci-raa > /dev/null
          [ "$kode" = 0 ]

      - name: Volumene i drift med compose (story 3.2, AD-11)
        # Eget prosjekt, saa bare volumene ose-ci-32_* lages og fjernes. app
        # kjoeres med innstillingene i compose.yaml, ogsaa read_only og tmpfs.
        run: |
          p=ose-ci-32
          # Foer trap: finnes volumene fra foer, stopper steget uten aa roere dem.
          fra_foer=$(docker volume ls -q --filter "name=^${p}_")
          if [ -n "$fra_foer" ]; then echo "volumer fra før: $fra_foer"; exit 1; fi
          trap 'docker compose -p $p down -v > /dev/null 2>&1 || true; docker volume rm ${p}_ose-db ${p}_ose-raa > /dev/null 2>&1 || true' EXIT
          svar() {
            for i in $(seq 1 30); do
              if docker compose -p $p exec -T app python -c "
          import urllib.request, sys
          s = urllib.request.urlopen('http://127.0.0.1:5000/')
          sys.exit(0 if s.status == 200 and 'docker compose run --rm hent' in s.read().decode() else 1)
          " 2>/dev/null; then return 0; fi
              sleep 1
            done
            docker compose -p $p logs app
            return 1
          }
          # Ny og tom base: siste skjemaversjon og ingen rader i kurs eller vurdering.
          tom_base() {
            docker compose -p $p exec -T app python -c "
          import sqlite3, lagring_sqlite as l
          from migrering import siste_versjon, versjon
          c = sqlite3.connect('file:/app/data/db/ose.db?mode=ro', uri=True)
          assert versjon(c) == siste_versjon(l.MIGRASJONSKATALOG), versjon(c)
          for tabell in ('kurs', 'vurdering'):
              assert c.execute(f'select count(*) from {tabell}').fetchone()[0] == 0, tabell
          "
          }
          docker compose -p $p up -d --build app
          svar
          tom_base
          # Bare /tmp og volumet kan skrives: tempfile bruker /tmp, og en fil i
          # hjemmemappa til ose, som ose eier, gir «Read-only file system».
          docker compose -p $p exec -T app python -c "
          import tempfile
          assert tempfile.gettempdir() == '/tmp', tempfile.gettempdir()
          tempfile.TemporaryFile('w+b').close()
          "
          ut=$(docker compose -p $p exec -T app sh -c 'touch /home/ose/skrevet' 2>&1 || true)
          echo "$ut" | grep -q "Read-only file system"
          # app har bare ose-db.
          monteringer=$(docker inspect "$(docker compose -p $p ps -q app)" --format '{{range .Mounts}}{{.Destination}} {{end}}')
          echo "app har $monteringer"
          [ "$(echo $monteringer)" = "/app/data/db" ]
          # En fil i ose-raa og et merke i ose-db.
          docker volume create ${p}_ose-raa > /dev/null
          docker run --rm --network none -v ${p}_ose-raa:/app/data/raa ose-signal:ci sh -c 'echo {} > /app/data/raa/kurser-raa-2026-01-02.json'
          docker compose -p $p exec -T app touch /app/data/db/merke
          # Basevolumet fjernes, oeyeblikksbildene staar.
          docker compose -p $p rm -s -f app
          docker volume rm ${p}_ose-db > /dev/null
          docker compose -p $p up -d app
          svar
          set +e
          docker compose -p $p exec -T app test -e /app/data/db/merke
          merke=$?
          set -e
          [ "$merke" = 1 ]
          tom_base
          docker run --rm --network none -v ${p}_ose-raa:/app/data/raa ose-signal:ci test -f /app/data/raa/kurser-raa-2026-01-02.json
          echo "ose-db fjernet og laget paa nytt, tom, og ose-raa sto"

      - name: Hentingen med skrivebeskyttet rot og /tmp som tmpfs
        # Samme innstillinger som hent i compose.yaml (read_only, tmpfs /tmp
        # og de to volumene), men med docker run og uten .env. Foerst det hent
        # skriver: basen migreres paa ose-db, en fil i ose-raa og en
        # midlertidig fil i /tmp. Saa hentekommandoen til noekkelen.
        run: |
          docker volume create ose-ci-ro-db > /dev/null
          docker volume create ose-ci-ro-raa > /dev/null
          trap 'docker volume rm ose-ci-ro-db ose-ci-ro-raa > /dev/null 2>&1 || true' EXIT
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v ose-ci-ro-db:/app/data/db -v ose-ci-ro-raa:/app/data/raa \
            ose-signal:ci python -c "
          import tempfile, lagring_sqlite as l, lagring_fil as f
          assert tempfile.gettempdir() == '/tmp', tempfile.gettempdir()
          tempfile.TemporaryFile('w+b').close()
          c = l.aapne_base(l.BASE_STI)
          c.execute('select count(*) from kurs').fetchone()
          c.close()
          with open(f.RAA_KATALOG / 'proeve-raa-2026-01-02.json', 'x') as ut:
              ut.write('{}')
          print('skrev basen, raa og /tmp')
          "
          set +e
          ut=$(docker run --rm --network none --read-only --tmpfs /tmp \
            -v ose-ci-ro-db:/app/data/db -v ose-ci-ro-raa:/app/data/raa \
            ose-signal:ci python src/fetch_prices.py --hent-foer-kl-22 2>&1)
          kode=$?
          set -e
          echo "$ut"
          echo "kode $kode"
          if echo "$ut" | grep -q Traceback; then exit 1; fi
          echo "$ut" | grep -q "EODHD_API_KEY mangler"
          [ "$kode" = 1 ]

      - name: compose.yaml starter bare webserveren uten profilen hent
        run: |
          [ "$(docker compose config --services)" = "app" ]
          [ "$(docker compose --profile hent config --services | sort | tr '\n' ' ')" = "app hent " ]
