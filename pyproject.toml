[project]
name = "ose-signal"
version = "0.1.0"
description = "OSE Signal - markedsoversikt for Oslo Bors"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
