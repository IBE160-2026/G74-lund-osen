[project]
name = "ose-signal"
version = "0.1.0"
description = "OSE Signal - markedsoversikt for Oslo Bors"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tzdata>=2026.4",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Story 2.3: hele suiten hang 07.10 og under mutant M4 08.10, uten at det kunne
# gjenskapes. Henger en test i over 120 s, skriver faulthandler stakken.
faulthandler_timeout = 120

# Story 9.7: ruff sjekker og formatterer src/ og tests/. Kjoeres foer en
# commit (CLAUDE.md regel 23), og CI og tests/test_ruff.py kjoerer det samme.
[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
src = ["src", "tests"]
# 120, ikke 88: naermest koden slik den var skrevet, og minst omformattering
# (spesifikasjonen for 9.7).
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Bare regler som finner feil eller rot, ikke smak (story 9.7).
select = [
    "F",  # pyflakes: ubrukte importer og navn, navn som ikke finnes
    "I",  # importene: sortert og gruppert, saa en dobbel eller glemt import synes
]
