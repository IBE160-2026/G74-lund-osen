<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <title>OSE Signal</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem auto;
      max-width: 54rem;
      padding: 0 1rem;
      color: #1a1a1a;
    }
    .eksempeltall {
      background: #fff3cd;
      border: 1px solid #c9a227;
      padding: 0.5rem 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  {% if eksempeltall %}
  <p class="eksempeltall">Eksempeltall: oppdiktede selskaper og kurser, ikke data fra Oslo Børs.</p>
  {% endif %}
  <h1>OSE Signal</h1>
  <p>
    Basen <code>{{ base }}</code> kan ikke åpnes eller leses, så siden kan ikke vises.
    Siden henter aldri data selv.
  </p>
  <p>Feilen: <code>{{ feil }}</code></p>
</body>
</html>
